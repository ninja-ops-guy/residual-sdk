[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-sdk"
version = "1.0.0"
description = "Framework-agnostic SDK for RESIDUAL run attestation (residual-spec adapters/interface.md)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]
